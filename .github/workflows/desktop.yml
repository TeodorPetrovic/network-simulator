name: Desktop app

on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths: ["desktop/**", "frontend/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifacts: "desktop/src-tauri/target/release/bundle/deb/*.deb desktop/src-tauri/target/release/bundle/appimage/*.AppImage"
          - os: windows-latest
            artifacts: "desktop/src-tauri/target/release/bundle/nsis/*.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install JavaScript dependencies
        run: |
          bun install --cwd frontend --frozen-lockfile
          bun install --cwd desktop

      - name: Frontend checks
        run: |
          bun run --cwd frontend typecheck
          bun run --cwd frontend test

      - name: Desktop shell tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Build installers
        run: bunx tauri build
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: network-studio-${{ runner.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
