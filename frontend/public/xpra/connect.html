<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Wireshark disconnected</title>
<style>
  body { margin: 0; display: grid; min-height: 100vh; place-items: center; background: #10151d; color: #d6dee9; font: 14px system-ui, sans-serif; }
  main { max-width: 420px; padding: 24px; text-align: center; }
  p { color: #9aa7b8; line-height: 1.5; }
  button { padding: 8px 14px; border: 1px solid #3a4658; border-radius: 6px; color: inherit; background: #1a222e; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Web Wireshark disconnected</h1>
  <p>The capture session is not running or the connection was closed. Start the capture again from the link's properties, then reopen Web Wireshark.</p>
  <button type="button" onclick="history.length > 1 ? history.back() : window.close()">Back</button>
</main>
</body>
</html>
